name: Windows client and server relay release

on:
  push:
    tags:
      - 'bundle-v*'

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r agent/requirements-build.txt
      - name: Build Windows client
        run: >-
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --paths . --hidden-import qrcode.image.pil --hidden-import pystray._win32
          --icon agent/remotevibecode.ico
          --add-data "agent/remotevibecode.ico;agent"
          --name RemoteVibecodeAgent agent/windows_agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: remotevibecode-windows-client
          path: dist/RemoteVibecodeAgent.exe
          if-no-files-found: error

  server-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: ./relay/build-deb.sh 0.1.0
      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/remotevibecode-relay_0.1.0_all.deb
          dpkg-deb --contents dist/remotevibecode-relay_0.1.0_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: remotevibecode-server-relay
          path: dist/remotevibecode-relay_0.1.0_all.deb
          if-no-files-found: error

  release:
    needs: [windows-client, server-relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: remotevibecode-windows-client
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: remotevibecode-server-relay
          path: release
      - name: Include Android app
        run: cp releases/RemoteVibecode-0.9.12.apk release/
      - name: Include Arch agent
        run: cp releases/remotevibecode-agent-0.1.9-1-any.pkg.tar.zst release/
      - name: Generate checksums
        run: cd release && sha256sum RemoteVibecodeAgent.exe remotevibecode-relay_0.1.0_all.deb remotevibecode-agent-0.1.9-1-any.pkg.tar.zst RemoteVibecode-0.9.12.apk > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/RemoteVibecodeAgent.exe
          release/remotevibecode-relay_0.1.0_all.deb
          release/remotevibecode-agent-0.1.9-1-any.pkg.tar.zst
          release/RemoteVibecode-0.9.12.apk
          release/SHA256SUMS.txt
          --repo "${{ github.repository }}"
          --title "RemoteVibecode ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
          --latest
