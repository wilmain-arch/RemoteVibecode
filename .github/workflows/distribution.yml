name: Сборка и выпуск комплекта

on:
  push:
    branches: [main]
    tags: ['bundle-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Установить линтер
        run: python -m pip install ruff==0.15.7
      - name: Проверить ошибки Python
        run: ruff check --select E9,F63,F7,F82 bridge agent relay scripts tests
      - name: Проверить компиляцию Python
        run: python -m compileall -q bridge agent relay scripts tests
      - name: Установить системные библиотеки Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Установить зависимости Qt для тестов
        run: python -m pip install -r agent/requirements-build.txt
      - name: Проверить регрессии
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  linux-package-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['debian:13', 'ubuntu:26.04']
    container: ${{ matrix.image }}
    steps:
      - name: Установить средства проверки пакета
        run: apt-get update && apt-get install -y ca-certificates git python3 openssl systemd binutils
      - uses: actions/checkout@v4
      - name: Собрать и установить ретранслятор
        run: |
          bash relay/build-deb.sh
          dpkg -i dist/remotevibecode-relay_*_all.deb
          python3 -m py_compile /usr/lib/remotevibecode/relay.py
          systemd-analyze verify /usr/lib/systemd/system/remotevibecode-relay.service
          test -s /etc/remotevibecode/relay-secret
          test "$(stat -c %a /etc/remotevibecode/relay-key)" = 600
      - name: Проверить установленный процесс и открытие портов
        run: |
          CREDENTIALS_DIRECTORY=/etc/remotevibecode python3 -u /usr/lib/remotevibecode/relay.py > /tmp/relay.log 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          python3 - <<'PYTHON'
          import socket, time
          for port in (8765, 8766, 8767):
              for attempt in range(100):
                  try:
                      with socket.create_connection(('127.0.0.1', port), timeout=.2): break
                  except OSError:
                      if attempt == 99: raise
                      time.sleep(.05)
          PYTHON

  metadata:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.versions.outputs.android }}
      agent: ${{ steps.versions.outputs.agent }}
      relay: ${{ steps.versions.outputs.relay }}
      bundle: ${{ steps.versions.outputs.bundle }}
      androidCert: ${{ steps.versions.outputs.androidCert }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: python3 scripts/release_metadata.py >> "$GITHUB_OUTPUT"
      - name: Проверить ссылки инструкций
        run: python3 scripts/check_docs.py
      - name: Проверить тег комплекта
        if: startsWith(github.ref, 'refs/tags/bundle-v')
        env:
          EXPECTED: bundle-v${{ steps.versions.outputs.bundle }}
        run: test "$GITHUB_REF_NAME" = "$EXPECTED"

  android:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RV_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RV_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RV_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Подготовить ключ подписи
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            test -n "$RV_ANDROID_STORE_PASSWORD"
            test -n "$RV_ANDROID_KEY_ALIAS"
            test -n "$RV_ANDROID_KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android.keystore"
            chmod 600 "$RUNNER_TEMP/android.keystore"
            echo "RV_ANDROID_KEYSTORE=$RUNNER_TEMP/android.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/bundle-v* ]]; then
            echo 'Для публикации настройте Android signing secrets по docs/BUILDING.md'
            exit 1
          fi
      - name: Собрать APK из исходников
        run: ./android/gradlew -p android :app:assembleRelayRelease :app:lintRelayRelease
      - name: Проверить сертификат пользовательской сборки
        if: env.KEYSTORE_BASE64 != ''
        env:
          EXPECTED_CERT: ${{ needs.metadata.outputs.androidCert }}
        shell: bash
        run: |
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/relay/release/app-relay-release.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = "$EXPECTED_CERT"
      - name: Подготовить файл
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/relay/release/app-relay-release.apk dist/RemoteVibecode-${{ needs.metadata.outputs.android }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/*.apk
          if-no-files-found: error
      - name: Удалить временный ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/android.keystore"

  android-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Разрешить KVM для тестового эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./android/gradlew -p android -PtaskFixture=true connectedRelayDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-report
          path: android/app/build/reports/androidTests/

  arch:
    needs: metadata
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git python
      - uses: actions/checkout@v4
      - name: Собрать пакет из текущего коммита
        shell: bash
        run: |
          sed -i "s/#tag=arch-v\$pkgver/#commit=$GITHUB_SHA/" arch/PKGBUILD
          useradd -m builder
          chown -R builder .
          su builder -c "cd '$GITHUB_WORKSPACE/arch' && makepkg --nodeps --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-build
          path: arch/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    if: startsWith(github.ref, 'refs/tags/bundle-v')
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r agent/requirements-build.txt
      - name: Проверить интерфейс Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_agent_qt.py -v
      - name: Собрать EXE
        run: >-
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --paths . --hidden-import qrcode.image.pil --hidden-import PySide6.QtSvg
          --icon agent/remotevibecode.ico --add-data "agent/remotevibecode.ico;agent"
          --add-data "agent/remotevibecode-tray.ico;agent" --add-data "agent/update-public.pem;agent" --add-data "agent/licenses;agent/licenses" --add-data "agent/THIRD_PARTY_NOTICES.md;agent" --name RemoteVibecodeAgent agent/windows_agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/RemoteVibecodeAgent.exe
          if-no-files-found: error

  relay:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./relay/build-deb.sh ${{ needs.metadata.outputs.relay }}
      - run: dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: relay-build
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/bundle-v')
    needs: [checks, metadata, android, android-device, linux-package-validation, arch, windows, relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-build'
          path: release
          merge-multiple: true
      - name: Сформировать суммы и состав комплекта
        run: |
          cp LICENSE release/LICENSE
          cp third_party/lucide/LICENSE release/LUCIDE-LICENSE
          cd release
          sha256sum *.apk *.exe *.deb *.pkg.tar.zst LICENSE LUCIDE-LICENSE > SHA256SUMS.txt
          cd ..
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          v = json.loads(Path('release.json').read_text())
          rows = '\n'.join(f'| {label} | {v[key]} |' for key,label in [('android','Android'),('agent','Агент ПК'),('relay','Ретранслятор')])
          notes = Path('RELEASE_NOTES.md').read_text()
          notes += '\n## Состав комплекта\n\n| Компонент | Версия |\n| --- | --- |\n' + rows
          notes += '\n\n[Порядок обновления](https://github.com/wilmain-arch/RemoteVibecode/blob/main/docs/UPDATING.md)\n'
          Path('release-notes.md').write_text(notes)
          PYTHON
      - name: Подписать манифест обновлений
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          test -n "$UPDATE_SIGNING_KEY"
          keyfile="$RUNNER_TEMP/update-signing.pem"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$UPDATE_SIGNING_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          python3 scripts/build_update_manifest.py release --key "$keyfile"
          cd release
          sha256sum update.json update.json.sig >> SHA256SUMS.txt
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --title "RemoteVibecode ${{ needs.metadata.outputs.bundle }}"
          --notes-file release-notes.md --latest
