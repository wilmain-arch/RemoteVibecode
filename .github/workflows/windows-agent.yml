name: Windows agent EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/**'
      - 'bridge/**'
      - '.github/workflows/windows-agent.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'bridge/**'
      - '.github/workflows/windows-agent.yml'
    tags:
      - 'agent-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r agent/requirements-build.txt
      - name: Build executable
        run: >-
          python -m PyInstaller --onefile --windowed --clean --noconfirm
          --paths . --hidden-import qrcode.image.pil --hidden-import PySide6.QtSvg
          --icon agent/remotevibecode.ico
          --add-data "agent/remotevibecode.ico;agent"
          --add-data "agent/remotevibecode-tray.ico;agent" --add-data "agent/update-public.pem;agent" --add-data "agent/licenses;agent/licenses" --add-data "agent/THIRD_PARTY_NOTICES.md;agent" --name RemoteVibecodeAgent agent/windows_agent.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RemoteVibecodeAgent-Windows-x64
          path: dist/RemoteVibecodeAgent.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RemoteVibecodeAgent-Windows-x64
          path: release
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/RemoteVibecodeAgent.exe
          --repo "${{ github.repository }}"
          --title "RemoteVibecode agent ${{ github.ref_name }}"
          --notes "Preview Windows agent. Requires a self-hosted RemoteVibecode relay and Codex Desktop or CLI on the PC. See agent/README.md."
          --prerelease
